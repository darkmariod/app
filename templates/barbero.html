{% extends "base.html" %}
{% block content %}
<header>
    <p class="option-subtitle">{{ servicio }}</p>
    <h1>Select Staff</h1>
</header>

<form action="/confirmacion" method="POST">
    <input type="hidden" name="servicio" value="{{ servicio }}">
    
    <div class="options-container">
        <label class="option-item">
            <div style="background: #e8e1d5; width: 48px; height: 48px; border-radius: 50%; margin-right: 16px; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 20px;">👤</span>
            </div>
            <div class="option-details">
                <div class="option-title">Any staff</div>
            </div>
            <input type="radio" name="barbero" value="Cualquiera" checked>
        </label>

        {% for b in barberos %}
        <label class="option-item">
            <div class="staff-avatar" style="background-image: url('/static/img/{{ b.nombre.lower() }}.jpg'); background-size: cover;"></div>
            <div class="option-details">
                <div class="option-title">{{ b.nombre }}</div>
            </div>
            <input type="radio" name="barbero" value="{{ b.nombre }}">
        </label>
        {% endfor %}
    </div>

    <div class="fixed-footer">
        <button type="submit" class="btn-add">Continue</button>
    </div>
</form>
{% endblock %}
