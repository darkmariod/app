{% extends "base.html" %}
{% block content %}
<div class="steps"><div class="step">Servicio</div><div class="step active">Barbero</div></div>
<h2>2. ¿Quién te atenderá?</h2>
<div class="cards-grid">
    {% for barbero in barberos %}
    <div class="barber-card">
        <img src="{{ url_for('static', filename=barbero.foto) if barbero.foto else url_for('static', filename='img/banner.jpg') }}">
        <h3>{{ barbero.nombre }}</h3>
        <form action="/confirmacion" method="POST">
            <input type="hidden" name="sede" value="{{ sede }}">
            <input type="hidden" name="servicio" value="{{ servicio }}">
            <input type="hidden" name="barbero" value="{{ barbero.nombre }}">
            <button type="submit" class="btn">Seleccionar</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
