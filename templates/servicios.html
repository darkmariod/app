{% extends "base.html" %}
{% block content %}
<div class="steps">
    <span class="step active">Servicio</span>
    <span class="step">Barbero</span>
    <span class="step">Cita</span>
</div>
<h2 style="text-align: center; font-size: 1.1rem; margin-bottom: 20px;">Elige un Servicio</h2>
<div class="cards-grid">
    {% for s in servicios %}
    <div class="card">
        <h3>{{ s.nombre }}</h3>
        <span class="price-tag">${{ s.precio }}</span>
        <form action="/barberos" method="POST">
            <input type="hidden" name="servicio" value="{{ s.nombre }}">
            <button class="btn">ELEGIR</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
