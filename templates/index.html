{% extends "base.html" %}
{% block content %}
<header>
    <p class="option-subtitle">All services</p>
    <h1>Mens Cut</h1>
</header>

<form action="/barberos" method="POST" id="booking-form">
    <div class="options-container">
        <p style="margin-bottom: 15px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Options</p>
        
        {% for s in servicios %}
        <label class="option-item">
            <div class="option-details">
                <div class="option-title">{{ s.nombre }}</div>
                <div class="option-subtitle">${{ s.precio }} • {{ s.duracion }} min</div>
            </div>
            <input type="radio" name="servicio" value="{{ s.nombre }}" required>
        </label>
        {% endfor %}
    </div>

    <div class="fixed-footer">
        <button type="submit" class="btn-add">Add</button>
    </div>
</form>
{% endblock %}
