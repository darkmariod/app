{% extends "base.html" %}
{% block content %}
<div class="steps">
    <span class="step">Servicio</span>
    <span class="step">Barbero</span>
    <span class="step active">Cita</span>
</div>
<div style="text-align:center;">
    <p style="color:var(--text-muted); font-size: 0.9rem;">Has elegido:</p>
    <h2 style="margin: 10px 0;">{{ servicio }}</h2>
    <p>Con <strong>{{ barbero }}</strong></p>
    <h1 style="color:var(--primary); margin: 20px 0;">${{ precio }}</h1>
    
    <input type="date" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); margin-bottom:10px;">
    <button class="btn" style="padding:15px; font-size:1rem;">CONFIRMAR CITA</button>
</div>
{% endblock %}
